[package]
name = "devnull"
description = "A Neovim-flavoured terminal client for dev-null.sh"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "dn"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
base64 = "0.22"
crossterm = { version = "0.29", default-features = false, features = ["events", "event-stream", "bracketed-paste", "osc52"] }
devnull-api = { version = "0.1.0", path = "../devnull-api" }
futures-util = { version = "0.3", default-features = false }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "underline-color", "layout-cache"] }
regex = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "fs"] }
unicode-segmentation = "1"
unicode-width = { version = "0.2", default-features = false }
# The shared Neovim look & feel, at its release tag (its D18).
wcgw-kit = { git = "https://github.com/wcgw/wcgw-kit", tag = "v0.1.1" }

[dev-dependencies]
wcgw-kit = { git = "https://github.com/wcgw/wcgw-kit", tag = "v0.1.1", features = ["testing"] }
insta = "1"
serde_json = "1"
tempfile = "3"
