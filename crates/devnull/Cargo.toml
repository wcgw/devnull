[package]
name = "devnull"
description = "A Neovim-flavoured terminal client for dev-null.sh"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "dn"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
crossterm = { version = "0.29", default-features = false, features = ["events", "event-stream", "bracketed-paste", "osc52"] }
futures-util = { version = "0.3", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "underline-color", "layout-cache"] }
regex = "1"
tokio = { version = "1", features = ["rt", "macros"] }
unicode-segmentation = "1"
unicode-width = { version = "0.2", default-features = false }

[dev-dependencies]
insta = "1"
