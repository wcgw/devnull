[package]
name = "devnull"
description = "A Neovim-flavoured terminal client for dev-null.sh"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "dn"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
regex = "1"
unicode-segmentation = "1"
unicode-width = { version = "0.2", default-features = false }
