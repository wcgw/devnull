[package]
name = "devnull-api"
description = "Typed client for the dev-null.sh API: models, endpoints, enrollment and SSHSIG request signing"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh-agent-client-rs = "1.1"
ssh-encoding = { version = "0.2", features = ["alloc", "std"] }
ssh-key = { version = "0.6", features = ["ed25519", "encryption", "getrandom", "std"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "net", "rt", "time"] }
url = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
wiremock = "0.6"
